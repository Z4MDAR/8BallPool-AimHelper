name: Build Aim Helper APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extract project
        run: |
          unzip 8BallPool_Manual_AimHelper_AndroidStudio.zip
          mv AimHelperAndroid project

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p project assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AimHelper-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
